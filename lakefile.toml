name = "FormalizedSparse"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FormalizedSparse"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "TrustworthyKedlaya"
git = "https://github.com/YijunYuan/TrustworthyKedlaya.git"
rev = "c26d9b65d17e68a26f75dbe8bf8c37d1f9e76d03"

[[lean_lib]]
name = "FormalizedSparse"
